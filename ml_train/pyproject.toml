[project]
name = "darpml"
version = "0.1.0"
description = "ML-guided ALNS operator selection for the Dial-a-Ride Problem"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
onnx = ["onnx>=1.14", "skl2onnx>=1.16"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
